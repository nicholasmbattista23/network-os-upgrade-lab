server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /srv/network-os;

    server_tokens off;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Full technical access log.
    access_log /var/log/nginx/network-os-access.log;

    # Human-readable operational logs.
    access_log /var/log/nginx/network-os-activity.log network_os_activity;
    access_log /var/log/nginx/network-os-success.log network_os_success if=$network_os_transfer_ok;

    error_log  /var/log/nginx/network-os-error.log;

    location / {
        try_files $uri $uri/ =404;

        limit_except GET HEAD {
            deny all;
        }
    }

    location ~ /\. {
        deny all;
    }
}
