# Network OS repository operational logging.
# This file is loaded in the nginx http context via /etc/nginx/conf.d/.

map "$request_method:$status:$request_completion" $network_os_transfer_ok {
    default 0;
    ~^GET:2[0-9][0-9]:OK$ 1;
}

log_format network_os_activity
    '$time_iso8601 REQUEST ip=$remote_addr '
    'method=$request_method uri="$uri" status=$status '
    'bytes=$body_bytes_sent duration=$request_time connection=$connection';

log_format network_os_success
    '$time_iso8601 TRANSFER_OK ip=$remote_addr '
    'file="$uri" status=$status bytes=$body_bytes_sent '
    'duration=$request_time connection=$connection';
